<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-synthesis:none;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
body{margin:0;width:max-content;min-width:250px;background:#0c1224;color:#f5f7ff;font-size:12px;overflow:hidden;user-select:none}
.panel{position:relative;display:flex;flex-direction:column;width:100%;min-width:250px;padding:18px 18px 16px;overflow:hidden;background:radial-gradient(180px 150px at 92% 5%,rgba(105,91,255,.22),transparent 70%),linear-gradient(145deg,#10182e 0%,#0c1224 72%)}
.panel:after{content:"";position:absolute;width:220px;height:220px;right:-110px;bottom:-130px;border:1px solid rgba(157,145,255,.11);border-radius:50%;box-shadow:0 0 0 24px rgba(157,145,255,.025),0 0 0 48px rgba(157,145,255,.018);pointer-events:none}
.header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
.brand{display:flex;align-items:center;gap:10px}
.mark{position:relative;width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,#786cff,#4f46d7);box-shadow:0 8px 18px rgba(91,78,235,.3),inset 0 1px rgba(255,255,255,.32);transform:rotate(-7deg)}
.mark:before,.mark:after{content:"";position:absolute;background:#fff;border-radius:4px;transform:rotate(7deg)}
.mark:before{width:12px;height:5px;left:8px;top:9px;opacity:.95}.mark:after{width:7px;height:5px;left:8px;top:16px;opacity:.6}
.brand-title{font-size:15px;font-weight:720;letter-spacing:-.02em;line-height:1.1}.brand-subtitle{margin-top:3px;color:#8d9ab9;font-size:10px;line-height:1.2;letter-spacing:.02em}
.pulse{width:8px;height:8px;border-radius:50%;background:#717b9a;box-shadow:0 0 0 4px rgba(113,123,154,.1)}
.workspace{position:relative;z-index:1;display:grid;width:100%;grid-template-columns:minmax(0,1fr)}
.card{border:1px solid rgba(163,175,221,.12);border-radius:14px;background:rgba(20,29,53,.78);box-shadow:0 12px 28px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.035)}
.meta-card{padding:5px 13px}.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px;border-bottom:1px solid rgba(163,175,221,.1)}.meta-row:last-child{border-bottom:0}.meta-label{color:#8d9ab9;font-size:11px}.meta-value{max-width:160px;overflow:hidden;color:#f3f5ff;font-size:11px;font-weight:650;letter-spacing:-.01em;text-overflow:ellipsis;white-space:nowrap}.meta-value.muted{color:#697795;font-weight:520}
.footer{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;width:0;min-width:100%;margin-top:15px}.status-chip{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%;min-height:29px;padding:0 11px;border-radius:999px;background:rgba(113,123,154,.12);color:#b4bfd7;font-size:11px;font-weight:650;letter-spacing:.005em;transition:background-color .2s ease,color .2s ease}.status-dot{flex:none;width:7px;height:7px;border-radius:50%;background:#8b98b6;box-shadow:0 0 0 4px rgba(139,152,182,.1)}#statusText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status-chip[data-state=connected]{background:rgba(38,190,112,.13);color:#baf6d0}.status-chip[data-state=connected] .status-dot{background:#35d27d;box-shadow:0 0 0 4px rgba(53,210,125,.12)}.status-chip[data-state=error]{background:rgba(255,91,103,.13);color:#ffc3c7}.status-chip[data-state=error] .status-dot{background:#ff5964;box-shadow:0 0 0 4px rgba(255,89,100,.13)}.build{flex:none;color:#667492;font-size:10px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main class="panel">
  <header class="header">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><div class="brand-title">Pholly Figma MCP</div><div class="brand-subtitle">Local design bridge</div></div></div>
    <span class="pulse" id="pulse" aria-hidden="true"></span>
  </header>
  <section class="workspace">
    <div class="card meta-card">
      <div class="meta-row"><span class="meta-label">File</span><strong class="meta-value muted" id="fileName">Unknown file</strong></div>
      <div class="meta-row"><span class="meta-label">Page</span><strong class="meta-value muted" id="pageName">Waiting…</strong></div>
      <div class="meta-row"><span class="meta-label">Selection</span><strong class="meta-value" id="selection">0 nodes</strong></div>
    </div>
  </section>
  <footer class="footer"><div class="status-chip" id="statusChip" data-state="connecting"><span class="status-dot"></span><span id="statusText">Connecting…</span></div><span class="build">0.2.2 · 1995</span></footer>
</main>
<script>
/*__BRIDGE_HMAC__*/
const endpoint='ws://localhost:1995/ws';const token='__PHOLLY_TOKEN__';const fallbackKey=`figma-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;const statusChip=document.getElementById('statusChip');const statusText=document.getElementById('statusText');const fileName=document.getElementById('fileName');const pageName=document.getElementById('pageName');const selection=document.getElementById('selection');let ws;let info;let registrationTimer;let inflightKey='';let busy=false;const pendingMethods=new Map();
const busyText='This file is open in another plugin window · retrying';
const panel=document.querySelector('.panel');let hugWidth=0;let hugHeight=0;
function hug(){const width=Math.max(250,Math.ceil(panel.getBoundingClientRect().width));const height=Math.ceil(panel.getBoundingClientRect().height);if(!width||!height||(width===hugWidth&&height===hugHeight))return;hugWidth=width;hugHeight=height;parent.postMessage({pluginMessage:{type:'resize',width,height}},'*');}
function setStatus(text,state){statusText.textContent=text;statusText.title=text;statusChip.dataset.state=state;hug();}
function requestFileInfo(){parent.postMessage({pluginMessage:{type:'ready'}},'*');}
function stopRegistration(){if(registrationTimer){clearInterval(registrationTimer);registrationTimer=undefined;}}
function updateFileInfo(m){info=m;if(typeof m.name==='string'){fileName.textContent=m.name;fileName.classList.remove('muted');fileName.title=m.name;}if(typeof m.pageName==='string'){pageName.textContent=m.pageName;pageName.classList.remove('muted');pageName.title=m.pageName;}hug();}
function beginHello(fileKey,meta){if(ws?.readyState!==1||!fileKey)return;if(fileKey===inflightKey)return;inflightKey=fileKey;ws.send(JSON.stringify({type:'hello-begin',fileKey,...meta}));}
function connect(){stopRegistration();inflightKey='';busy=false;setStatus('Connecting…','connecting');try{ws=new WebSocket(endpoint);}catch(error){setStatus('Connection blocked','error');setTimeout(connect,1500);return;}ws.onopen=()=>{setStatus('Registering file…','connecting');beginHello(fallbackKey,{name:'Figma document',editorType:'figma'});requestFileInfo();registrationTimer=setInterval(requestFileInfo,500);};ws.onerror=()=>setStatus('Bridge unavailable','error');ws.onclose=()=>{stopRegistration();inflightKey='';const retryBusy=busy;busy=false;setStatus(retryBusy?busyText:'Disconnected · retrying','error');setTimeout(connect,1500);};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch{return;}if(m.type==='challenge'&&typeof m.nonce==='string'){const fileKey=inflightKey;if(!fileKey)return;const mac=hmacSha256Hex(token,`${m.nonce}.${fileKey}`);if(fileKey===inflightKey&&ws.readyState===1)ws.send(JSON.stringify({type:'hello',nonce:m.nonce,mac,fileKey}));return;}if(m.type==='error'&&m.code==='FILE_BUSY'){busy=true;setStatus(busyText,'error');return;}if(m.type==='ready'){inflightKey='';if(info&&m.fileKey===info.fileKey){stopRegistration();busy=false;setStatus('Connected','connected');}return;}if(m.method){pendingMethods.set(m.id,m.method);parent.postMessage({pluginMessage:{type:'request',id:m.id,method:m.method,params:m.params}},'*');}};}
window.onmessage=e=>{const m=e.data.pluginMessage;if(m?.type==='selection'&&typeof m.count==='number'){selection.textContent=`${m.count} node${m.count===1?'':'s'}`;hug();}if(m?.type==='file-info'){updateFileInfo(m);if(ws?.readyState===1){const {type:_drop,...fileInfo}=m;beginHello(fileInfo.fileKey,fileInfo);}}if(m?.type==='response'&&ws?.readyState===1){const method=pendingMethods.get(m.id);pendingMethods.delete(m.id);if(method==='get_selection'&&m.ok&&Array.isArray(m.result))selection.textContent=`${m.result.length} node${m.result.length===1?'':'s'}`;if(method==='inspect_selection'&&m.ok&&typeof m.result?.selectionCount==='number')selection.textContent=`${m.result.selectionCount} node${m.result.selectionCount===1?'':'s'}`;if(method==='get_metadata'&&m.ok&&m.result)updateFileInfo(m.result);hug();ws.send(JSON.stringify(m));}};connect();requestAnimationFrame(hug);
</script>
</body>
</html>

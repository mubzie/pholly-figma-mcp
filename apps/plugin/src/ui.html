<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-synthesis:none;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
body{margin:0;min-width:320px;min-height:100vh;background:#0c1224;color:#f5f7ff;font-size:12px;overflow:hidden;user-select:none}
.panel{position:relative;min-height:260px;height:100vh;padding:18px 18px 16px;overflow:hidden;background:radial-gradient(180px 150px at 92% 5%,rgba(105,91,255,.22),transparent 70%),linear-gradient(145deg,#10182e 0%,#0c1224 72%)}
.panel:after{content:"";position:absolute;width:220px;height:220px;right:-110px;bottom:-130px;border:1px solid rgba(157,145,255,.11);border-radius:50%;box-shadow:0 0 0 24px rgba(157,145,255,.025),0 0 0 48px rgba(157,145,255,.018);pointer-events:none}
.header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
.brand{display:flex;align-items:center;gap:10px}
.mark{position:relative;width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,#786cff,#4f46d7);box-shadow:0 8px 18px rgba(91,78,235,.3),inset 0 1px rgba(255,255,255,.32);transform:rotate(-7deg)}
.mark:before,.mark:after{content:"";position:absolute;background:#fff;border-radius:4px;transform:rotate(7deg)}
.mark:before{width:12px;height:5px;left:8px;top:9px;opacity:.95}.mark:after{width:7px;height:5px;left:8px;top:16px;opacity:.6}
.brand-title{font-size:15px;font-weight:720;letter-spacing:-.02em;line-height:1.1}.brand-subtitle{margin-top:3px;color:#8d9ab9;font-size:10px;line-height:1.2;letter-spacing:.02em}
.pulse{width:8px;height:8px;border-radius:50%;background:#717b9a;box-shadow:0 0 0 4px rgba(113,123,154,.1)}
.workspace{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:12px}
.card{border:1px solid rgba(163,175,221,.12);border-radius:14px;background:rgba(20,29,53,.78);box-shadow:0 12px 28px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.035)}
.meta-card{padding:5px 13px}.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px;border-bottom:1px solid rgba(163,175,221,.1)}.meta-row:last-child{border-bottom:0}.meta-label{color:#8d9ab9;font-size:11px}.meta-value{max-width:150px;overflow:hidden;color:#f3f5ff;font-size:11px;font-weight:650;letter-spacing:-.01em;text-overflow:ellipsis;white-space:nowrap}.meta-value.muted{color:#697795;font-weight:520}
.identity{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px;text-align:center}.identity-mark{display:grid;place-items:center;width:42px;height:42px;margin-bottom:8px;border-radius:13px;background:linear-gradient(145deg,#7567ff,#453bc5);box-shadow:0 10px 20px rgba(78,65,215,.28),inset 0 1px rgba(255,255,255,.35)}.identity-mark svg{width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}.identity-name{margin:0;color:#fff;font-size:17px;font-weight:760;letter-spacing:-.04em}.identity-note{margin:5px 0 0;color:#8d9ab9;font-size:10px;line-height:1.35}
.footer{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;margin-top:15px}.status-chip{display:inline-flex;align-items:center;gap:8px;min-height:29px;padding:0 11px;border-radius:999px;background:rgba(113,123,154,.12);color:#b4bfd7;font-size:11px;font-weight:650;letter-spacing:.005em;transition:background-color .2s ease,color .2s ease}.status-dot{width:7px;height:7px;border-radius:50%;background:#8b98b6;box-shadow:0 0 0 4px rgba(139,152,182,.1)}.status-chip[data-state=connected]{background:rgba(38,190,112,.13);color:#baf6d0}.status-chip[data-state=connected] .status-dot{background:#35d27d;box-shadow:0 0 0 4px rgba(53,210,125,.12)}.status-chip[data-state=error]{background:rgba(255,91,103,.13);color:#ffc3c7}.status-chip[data-state=error] .status-dot{background:#ff5964;box-shadow:0 0 0 4px rgba(255,89,100,.13)}.build{color:#667492;font-size:10px;font-variant-numeric:tabular-nums}
@media (max-width:350px){.panel{padding-inline:14px}.workspace{grid-template-columns:minmax(0,1fr) 110px}.identity{padding-inline:6px}.meta-value{max-width:120px}}
</style>
</head>
<body>
<main class="panel">
  <header class="header">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><div class="brand-title">Pholly Figma MCP</div><div class="brand-subtitle">Local design bridge</div></div></div>
    <span class="pulse" id="pulse" aria-hidden="true"></span>
  </header>
  <section class="workspace">
    <div class="card meta-card">
      <div class="meta-row"><span class="meta-label">File</span><strong class="meta-value muted" id="fileName">Unknown file</strong></div>
      <div class="meta-row"><span class="meta-label">Page</span><strong class="meta-value muted" id="pageName">Waiting…</strong></div>
      <div class="meta-row"><span class="meta-label">Selection</span><strong class="meta-value" id="selection">0 nodes</strong></div>
    </div>
    <div class="card identity">
      <div class="identity-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6.4 7.1 12 4l5.6 3.1v6.5L12 16.8l-5.6-3.2V7.1Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/><path d="m9 11.4 3 1.7 3-1.7M12 8.1v5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <p class="identity-name">Pholly</p><p class="identity-note">Local-first<br>Figma bridge</p>
    </div>
  </section>
  <footer class="footer"><div class="status-chip" id="statusChip" data-state="connecting"><span class="status-dot"></span><span id="statusText">Connecting…</span></div><span class="build">v6 · 1995</span></footer>
</main>
<script>
const endpoint='ws://localhost:1995/ws';const fallbackKey=`figma-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;const statusChip=document.getElementById('statusChip');const statusText=document.getElementById('statusText');const fileName=document.getElementById('fileName');const pageName=document.getElementById('pageName');const selection=document.getElementById('selection');let ws;let info;let registrationTimer;const pendingMethods=new Map();
function setStatus(text,state){statusText.textContent=text;statusChip.dataset.state=state;}
function requestFileInfo(){parent.postMessage({pluginMessage:{type:'ready'}},'*');}
function stopRegistration(){if(registrationTimer){clearInterval(registrationTimer);registrationTimer=undefined;}}
function updateFileInfo(m){info=m;if(typeof m.name==='string'){fileName.textContent=m.name;fileName.classList.remove('muted');fileName.title=m.name;}if(typeof m.pageName==='string'){pageName.textContent=m.pageName;pageName.classList.remove('muted');pageName.title=m.pageName;}}
function connect(){stopRegistration();setStatus('Connecting…','connecting');try{ws=new WebSocket(endpoint);}catch(error){setStatus('Connection blocked','error');setTimeout(connect,1500);return;}ws.onopen=()=>{setStatus('Registering file…','connecting');ws.send(JSON.stringify({type:'hello',fileKey:fallbackKey,name:'Figma document',editorType:'figma'}));requestFileInfo();registrationTimer=setInterval(requestFileInfo,500);};ws.onerror=()=>setStatus('Bridge unavailable','error');ws.onclose=()=>{stopRegistration();setStatus('Disconnected · retrying','error');setTimeout(connect,1500);};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch{return;}if(m.type==='ready'){if(info&&m.fileKey===info.fileKey){stopRegistration();setStatus('Connected','connected');}return;}if(m.method){pendingMethods.set(m.id,m.method);parent.postMessage({pluginMessage:{type:'request',id:m.id,method:m.method,params:m.params}},'*');}};}
window.onmessage=e=>{const m=e.data.pluginMessage;if(m?.type==='file-info'){updateFileInfo(m);if(ws?.readyState===1)ws.send(JSON.stringify({type:'hello',...m}));}if(m?.type==='response'&&ws?.readyState===1){const method=pendingMethods.get(m.id);pendingMethods.delete(m.id);if(method==='get_selection'&&m.ok&&Array.isArray(m.result))selection.textContent=`${m.result.length} node${m.result.length===1?'':'s'}`;if(method==='inspect_selection'&&m.ok&&typeof m.result?.selectionCount==='number')selection.textContent=`${m.result.selectionCount} node${m.result.selectionCount===1?'':'s'}`;if(method==='get_metadata'&&m.ok&&m.result)updateFileInfo(m.result);ws.send(JSON.stringify(m));}};connect();
</script>
</body>
</html>
